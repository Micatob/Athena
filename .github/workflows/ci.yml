name: Athena CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      # Pinned to the version the baseline was generated with - a flake8 /
      # pycodestyle upgrade can add checks and would look like new debt.
      - run: pip install flake8==7.3.0
      # The repo carries ~1000 pre-existing warnings (baseline snapshot in
      # .github/flake8-baseline.txt). Capture everything, then fail ONLY on
      # warnings the baseline does not cover - i.e. no NEW lint debt.
      - name: flake8 against baseline
        run: |
          python -m flake8 athena.py modules/ tests/ --max-line-length=140 \
            --ignore=E402,W503,E203 --format="%(path)s|%(code)s|%(text)s" \
            > flake8-current.out || true
          python scripts/check_ci_baseline.py check flake8 \
            flake8-current.out .github/flake8-baseline.txt

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install bandit==1.9.4 pip-audit
      # Baseline gate: new HIGH-severity findings fail; new medium/low are
      # warnings (the codebase legitimately grows B104/B110-style notes).
      - name: bandit against baseline
        run: |
          python -m bandit -r athena.py modules/ --skip B101,B307,B311 \
            -f json -o bandit-current.json || true
          python scripts/check_ci_baseline.py check bandit \
            bandit-current.json .github/bandit-baseline.txt
      # Verified clean 2026-10-17 (old --service-url flag no longer exists
      # in pip-audit 2.x and failed unconditionally).
      - name: pip-audit dependency vulnerabilities
        run: pip-audit -r requirements.txt --progress-spinner off

  test:
    runs-on: ubuntu-latest
    needs: [lint, security]
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-asyncio pytest-cov aioresponses
      - run: python -m pytest tests/ -v --cov=modules --cov-report=term --cov-report=xml
      - uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # Docker build/push job DISABLED 2026-10-17 by operator decision.
