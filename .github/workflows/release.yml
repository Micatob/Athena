name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

env:
  PYTHON_DEFAULT: "3.11"

jobs:
  # ============================================================
  # Job 1 – Validate (lint + test) before releasing
  # ============================================================
  validate:
    name: Validate Release Build
    runs-on: ubuntu-latest

    env:
      ATHENA_API_KEY: "release-validation-key"
      REQUIRE_API_KEY: "true"
      AETHELRED_SAFE_MODE: "true"
      AETHELRED_STEALTH: "false"
      AETHELRED_PROFILE: "balanced"
      HTTP_TIMEOUT: "5"
      HTTP_MAX_RETRIES: "2"
      STEALTH_MIN_DELAY: "0"
      STEALTH_MAX_DELAY: "0.05"
      HTTPS_ENABLED: "false"
      MAX_TARGETS_PER_REQUEST: "5"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # full history for changelog generation

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-release-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (errors only)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
            --exclude=.venv,__pycache__,.git

      - name: Security scan
        run: bandit -r modules/ athena.py -ll || true

      - name: Run tests
        run: |
          pytest tests/ \
            --asyncio-mode=auto \
            --cov=modules \
            --cov=athena \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            -v --tb=short --timeout=60

  # ============================================================
  # Job 2 – Build release package and publish GitHub Release
  # ============================================================
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog from git log
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi
          CHANGELOG=$(git log "$RANGE" \
            --pretty=format:"* %s (%an)" \
            --no-merges | head -50)
          # Write to file to avoid shell quoting issues
          echo "$CHANGELOG" > changelog.md
          cat changelog.md

      - name: Create release ZIP archive
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          ARCHIVE_NAME="athena-${VERSION}.zip"

          # Include source, config, docs, requirements; exclude dev artifacts
          zip -r "$ARCHIVE_NAME" \
            athena.py \
            modules/ \
            config/ \
            docs/ \
            tests/ \
            requirements.txt \
            .env.example \
            ENHANCED_README.md \
            QUICKSTART.md \
            -x "**/__pycache__/*" \
            -x "**/.venv/*" \
            -x "**/*.pyc" \
            -x "**/*.log" \
            -x "**/report*.json" \
            -x "**/.env"

          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Athena Security Suite ${{ steps.version.outputs.VERSION }}"
          tag_name: ${{ steps.version.outputs.VERSION }}
          body_path: changelog.md
          files: ${{ env.ARCHIVE_NAME }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts to Actions
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.VERSION }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            changelog.md
          retention-days: 90
